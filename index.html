<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1b3e" />
  <title>Checklist MAF</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <section id="loginView" class="login-shell">
    <div class="login-card">
      <div class="brand-mark">✓</div>
      <h1>Checklist MAF</h1>
      <p>Inicia sesión para consultar y actualizar los mismos pendientes desde cualquier dispositivo.</p>
      <form id="loginForm" class="stack">
        <input id="emailInput" type="email" placeholder="Correo electrónico" autocomplete="email" required />
        <input id="passwordInput" type="password" placeholder="Contraseña" autocomplete="current-password" required />
        <button id="loginButton" class="button primary" type="submit">Iniciar sesión</button>
      </form>
      <p id="loginMessage" class="message"></p>
    </div>
  </section>

  <main id="appView" class="app hidden">
    <header class="header">
      <div>
        <h1>Checklist Diario MAF</h1>
        <p>Pendientes compartidos, progreso e historial</p>
      </div>
      <div class="account">
        <strong id="userEmail"></strong>
        <button id="logoutButton" class="button light small" type="button">Cerrar sesión</button>
      </div>
      <div class="date-selector">
        <button id="previousDayButton" class="date-button" type="button">←</button>
        <input id="selectedDate" type="date" />
        <button id="nextDayButton" class="date-button" type="button">→</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="today" type="button">HOY</button>
      <button class="tab" data-tab="history" type="button">HISTORIAL</button>
    </nav>

    <section id="todayView">
      <article class="card">
        <div class="progress-header">
          <div>
            <h2>Progreso del día</h2>
            <p id="progressText">0 de 0 tareas completadas</p>
          </div>
          <strong id="progressPercent">0%</strong>
        </div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </article>

      <article class="card">
        <form id="taskForm" class="task-form">
          <select id="sectionSelect" required></select>
          <input id="taskInput" type="text" maxlength="180" placeholder="Escribe un pendiente..." required />
          <button class="button primary" type="submit">+ Agregar pendiente</button>
        </form>
        <form id="sectionForm" class="section-form">
          <input id="sectionInput" type="text" maxlength="60" placeholder="Crear nueva sección..." />
          <button class="button light" type="submit">+ Agregar sección</button>
        </form>
      </article>

      <section id="sectionsContainer"></section>
      <div class="bottom-actions">
        <button id="carryButton" class="button light" type="button">Pasar pendientes de ayer</button>
        <button id="refreshButton" class="button light" type="button">Actualizar</button>
      </div>
      <p id="appMessage" class="message center">Conectando...</p>
    </section>

    <section id="historyView" class="hidden">
      <article class="card">
        <div class="history-heading"><div><h2>Historial diario</h2><p>Últimos 30 días con actividad</p></div></div>
        <div id="historyContainer"></div>
      </article>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
